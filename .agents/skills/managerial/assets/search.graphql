# Issues and PRs matching a GitHub search, every page once (gh api --paginate).
# $q carries the full search string, repository included
# ("repo:<owner/name> is:issue is:open ..."); the caller writes the repository
# in literally (the skill's `<repo>` fact), never through a shell variable.
query($q: String!, $endCursor: String) {
  search(query: $q, type: ISSUE, first: 100, after: $endCursor) {
    pageInfo { hasNextPage endCursor }
    nodes {
      ... on Issue { number title labels(first: 20) { nodes { name } } }
      ... on PullRequest {
        number title headRefName mergedAt
        closingIssuesReferences(first: 10) { nodes { number } }
      }
    }
  }
}
